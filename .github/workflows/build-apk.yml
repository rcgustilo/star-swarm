name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/debug/app-debug.apk StarSwarm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StarSwarm-apk
          path: StarSwarm.apk

      - name: Publish to Releases (easy phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" StarSwarm.apk --title "Star Swarm $TAG" --notes "Download StarSwarm.apk below and open it on your phone." --latest

      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 build.log > build-error.log || echo "no log" > build-error.log
          gh release create "log-${{ github.run_number }}" build-error.log --title "Build log ${{ github.run_number }}" --notes "Build failed" --prerelease
